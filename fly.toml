# fly.toml app configuration file for thermalsim.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Single-machine app: keep count at 1 with `fly scale count 1 -a thermalsim`
# and always deploy with `fly deploy --ha=false` (CI already does this),
# otherwise Fly defaults back to 2 machines for HA.

app = 'thermalsim'
primary_region = 'syd'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
