server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Assets aren't content-hashed, so have browsers revalidate on each load
    # (a cheap 304 via ETag) instead of running stale modules after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
